services:
  flask:
    build:
      context: .
    container_name: food-flask
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: fooduser
      DB_PASSWORD: foodpass123
      DB_NAME: food_delivery
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - food-delivery-net

  mysql:
    image: mysql:8.4
    container_name: food-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: food_delivery
      MYSQL_USER: fooduser
      MYSQL_PASSWORD: foodpass123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - food-delivery-net

  redis:
    image: redis:7-alpine
    container_name: food-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - food-delivery-net

networks:
  food-delivery-net:
    name: food-delivery-net
    driver: bridge

volumes:
  mysql_data:
  redis_data:
